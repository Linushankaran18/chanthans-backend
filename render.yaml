# Render Blueprint: https://render.com/docs/blueprint-spec
# Render dashboard -> New -> Blueprint -> pick this repo. Variables marked `sync: false`
# are asked for once in the dashboard (never commit real values here).
services:
  - type: web
    name: chanthans-api
    runtime: docker
    # Nearest Render region to the Supabase DB (ap-northeast-1, Tokyo). Change if you move the DB.
    region: singapore
    # `preDeployCommand` needs a paid plan. On the free plan, remove that line and run
    # `alembic upgrade head` from your machine whenever the schema changes
    # (the free plan also sleeps when idle, so the first request can take ~50s).
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    preDeployCommand: alembic upgrade head
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: STORAGE_BACKEND
        value: r2
      # Generated once by Render and kept stable across deploys (>= 32 chars).
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: MAX_UPLOAD_SIZE_MB
        value: "10"

      # Supabase session pooler URL (postgresql://postgres.<ref>:<url-encoded-password>@aws-0-<region>.pooler.supabase.com:5432/postgres)
      - key: DATABASE_URL
        sync: false

      # Exact origins (https, no trailing slash, no wildcard), comma-separated, e.g.
      # https://chanthans.com,https://www.chanthans.com,https://dashboard.chanthans.com
      - key: ALLOWED_ORIGINS
        sync: false

      # Cloudflare R2
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      # Public URL of the bucket, no trailing slash, e.g. https://media.example.com
      - key: R2_PUBLIC_URL
        sync: false

      # Studio timezone (IANA). Booking times are studio-local wall-clock values.
      - key: APP_TIMEZONE
        value: America/Toronto

      # Admin dashboard origin used for the post-Google-sign-in redirect, e.g. https://dashboard.chanthans.com
      - key: FRONTEND_URL
        sync: false

      # Google Calendar integration (see README "Google Calendar integration")
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # https://api.chanthans.com/api/v1/integrations/google-calendar/callback
      - key: GOOGLE_REDIRECT_URI
        sync: false
      # "Continue with Google" dashboard sign-in (same OAuth client)
      # https://api.chanthans.com/api/v1/auth/google/callback
      - key: GOOGLE_LOGIN_REDIRECT_URI
        sync: false
      # Comma-separated allowed Google emails; set in the Render dashboard (not committed)
      - key: GOOGLE_LOGIN_ALLOWED_EMAILS
        sync: false
      - key: GOOGLE_CALENDAR_SCOPES
        value: openid email https://www.googleapis.com/auth/calendar.events
      - key: GOOGLE_CALENDAR_DEFAULT_ID
        value: primary
      # Fernet key; generate once and keep it stable (changing it forces Google to be reconnected).
      - key: TOKEN_ENCRYPTION_KEY
        sync: false

      # Invoices: business identity printed on every invoice and used to pre-fill new ones.
      - key: BUSINESS_NAME
        value: Chanthans
      # The logo is bundled in the image (app/assets/logo.png). Only set BUSINESS_LOGO_URL to override it.
      # Use a literal \n for line breaks
      - key: BUSINESS_ADDRESS
        value: "9699 Jane St\\nVaughan, ON L6A 3R4\\nCanada"
      - key: BUSINESS_PHONE
        value: "+1 437-551-8683"
      - key: BUSINESS_EMAIL
        sync: false
      - key: BUSINESS_WEBSITE
        sync: false
      - key: BUSINESS_CURRENCY
        value: CAD
      - key: INVOICE_PREFIX
        value: INV
      - key: INVOICE_DUE_DAYS
        value: "14"
      # Tax is never assumed; set per invoice, or give a studio-wide default here (rate is a percentage).
      - key: INVOICE_DEFAULT_TAX_NAME
        sync: false
      - key: INVOICE_DEFAULT_TAX_RATE
        value: "0"
      - key: INVOICE_PAGE_SIZE
        value: Letter
